version: 3

serviecs:
  nginx:
    image: nginx:latest
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/defaut.conf:/etc/nginx/conf.d/default.conf
      - ./dist:/dist

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./letsencrypt:/etc/letsencrypt
      - ./dist:/dist
    command: ["--version"]
